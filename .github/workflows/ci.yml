name: ci
on:
  push:
    branches: [main, main-office]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: office-partner-tgz
          path: release/*.tgz
